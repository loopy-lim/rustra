[package]
name = "rustra"
description.workspace = true
repository.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
tauri = ["dep:tauri"]

[dependencies]
rustra-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
postcard.workspace = true
tauri = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.5"
proptest = "1"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
postcard = { workspace = true }

[[bench]]
name = "tier_compare"
harness = false

[[bench]]
name = "dynamic_registry"
harness = false

[[bench]]
name = "type_scaling"
harness = false
