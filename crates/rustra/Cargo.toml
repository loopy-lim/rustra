[package]
name = "rustra"
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
tauri = ["dep:tauri"]
# dev 전용 네이티브 dylib 핫스왑 표면(hot_core) — 릴리스 빌드는 정적 링크 경로를
# 그대로 쓰므로 기본 기능 집합에 들지 않는다.
hot-core = ["dep:libloading"]

[dependencies]
rustra-naming.workspace = true
rustra-macros.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
postcard.workspace = true
# hot-core 전용 — tauri 와 마찬가지로 워크스페이스 공용 의존이 아닌 크레이트
# 로컬 optional 의존으로 둔다(호스트 측 dlopen 프리미티브).
libloading = { version = "0.9", optional = true }
# The bounded IPC channel uses the verified direct-delivery threshold in this
# version. Review that boundary before accepting a different Tauri release.
tauri = { version = "=2.11.1", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = "0.8"
proptest = "1"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
postcard = { workspace = true }

[[bench]]
name = "tier_compare"
harness = false

[[bench]]
name = "complex_route"
harness = false

[[bench]]
name = "dynamic_registry"
harness = false

[[bench]]
name = "type_scaling"
harness = false
