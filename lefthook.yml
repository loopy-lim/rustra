pre-commit:
  parallel: true
  commands:
    eslint:
      glob: 'packages/*/src/**/*.ts'
      run: bunx eslint --fix {staged_files}
    prettier:
      glob: '*.{ts,js,json,yml,md}'
      run: bunx prettier --write {staged_files}
    rustfmt:
      glob: '*.rs'
      run: rustfmt -- {staged_files}
