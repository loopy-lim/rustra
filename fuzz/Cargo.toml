[package]
name = "rustra-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# 메인 workspace 비멤버 — cargo-fuzz 전용 프로파일/nightly 를 격리한다.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rustra = { path = "../crates/rustra" }
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }

[[bin]]
name = "invoke_frame"
path = "fuzz_targets/invoke_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invoke_complex_value"
path = "fuzz_targets/invoke_complex_value.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invoke_complex_serde"
path = "fuzz_targets/invoke_complex_serde.rs"
test = false
doc = false
bench = false
