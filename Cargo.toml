[workspace]
members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/tauri-calculator/src-tauri",
  "examples/benchmark",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
description = "Rust → TypeScript bridge framework with auto-generated type-safe clients"
repository = "https://github.com/loopy-lim/hostra"

[workspace.dependencies]
rustra-macros = { version = "0.1.0", path = "crates/rustra-macros" }
rustra = { path = "crates/rustra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
