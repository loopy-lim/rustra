[workspace]
members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/tauri-calculator/src-tauri",
  "examples/lynx-tauri-spike/src-tauri",
  "examples/benchmark",
  "examples/streaming",
  "examples/auth",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.1"
description = "Rust → TypeScript bridge framework with auto-generated type-safe clients"
repository = "https://github.com/loopy-lim/hostra"

[workspace.dependencies]
rustra-macros = { version = "0.1.1", path = "crates/rustra-macros" }
rustra = { version = "0.1.1", path = "crates/rustra" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }
