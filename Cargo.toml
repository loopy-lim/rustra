[workspace]
members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/tauri-calculator/src-tauri",
  "examples/benchmark",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
rustra-macros = { path = "crates/rustra-macros" }
rustra = { path = "crates/rustra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
