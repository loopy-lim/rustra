[workspace]
members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/tauri-calculator/src-tauri",
  "examples/lynx-tauri-spike/src-tauri",
  "examples/benchmark",
  "examples/streaming",
  "examples/auth",
]
# bare cargo/clippy/test 가 macOS 전용 크레이트(lynx-tauri-spike: lynx_desktop.mm
# Objective-C++)를 빌드하지 않게 한다 — Linux CI 는 물론, Lynx SDK 헤더가 없는
# macOS 환경에서도 bare 명령이 green. 스파이크는 자체 verify.sh 게이트로 검증.
default-members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/benchmark",
  "examples/streaming",
  "examples/auth",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.2"
description = "Rust → TypeScript bridge framework with auto-generated type-safe clients"
repository = "https://github.com/loopy-lim/hostra"

[workspace.dependencies]
rustra-macros = { version = "0.1.2", path = "crates/rustra-macros" }
rustra = { version = "0.1.2", path = "crates/rustra" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1", features = ["alloc"] }

# Rustra builds several native hosts and target triples. Full dependency debug
# info plus incremental caches grows into tens of GiB without a size limit.
# Keep line tables for workspace debugging, but do not retain incremental state
# or dependency debug info in the local dev/test profiles.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
