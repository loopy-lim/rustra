[workspace]
members = [
  "crates/rustra-naming",
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/tauri-calculator/src-tauri",
  "examples/benchmark",
  "examples/streaming",
  "examples/auth",
]
# bare cargo/clippy/test 가 macOS 전용 크레이트(tauri-calculator)를 빌드하지 않게
# 한다 — Linux CI 는 물론, Tauri 시스템 라이브러리가 없는 macOS 환경에서도 bare
# 명령이 green. Tauri 예제는 자체 smoke 게이트로 검증.
default-members = [
  "crates/rustra",
  "crates/rustra-macros",
  "examples/calculator",
  "examples/crud",
  "examples/calculator-napi",
  "examples/benchmark",
  "examples/streaming",
  "examples/auth",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.8.0"
description = "Rust → TypeScript bridge framework with auto-generated type-safe clients"
repository = "https://github.com/loopy-lim/rustra"
homepage = "https://github.com/loopy-lim/rustra"
documentation = "https://docs.rs/rustra"
keywords = ["typescript", "bridge", "codegen", "ffi", "react-native"]
categories = ["api-bindings", "development-tools::ffi"]
# edition 2024 (1.85) + let-chains (1.88, rustra-macros 에서 사용) 요구 최소 — MSRV 계약화
rust-version = "1.88"

[workspace.dependencies]
rustra-naming = { version = "0.8.0", path = "crates/rustra-naming" }
rustra-macros = { version = "0.8.0", path = "crates/rustra-macros" }
rustra = { version = "0.8.0", path = "crates/rustra" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }

# Rustra builds several native hosts and target triples. Full dependency debug
# info plus incremental caches grows into tens of GiB without a size limit.
# Keep line tables for workspace debugging, but do not retain incremental state
# or dependency debug info in the local dev/test profiles.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
