# 로컬 개발 툴체인 핀 — CI 정식 잡(rust / ts-checks / wasm32 / napi …)이 쓰는
# dtolnay/rust-toolchain@1.95.0 와 동일 버전(.github/workflows/ci.yml 참고).
# rustup 은 이 파일을 읽어 자동으로 1.95.0 을 설치한다(nvmrc 의 Node 핀과 한 쌍).
#
# 주의 — rust-msrv 잡은 dtolnay/rust-toolchain@1.88.0 로 MSRV(1.88) 계약을 검증한다.
# rustup은 이 파일을 러너의 default 툴체인보다 우선하므로, MSRV 잡은
# RUSTUP_TOOLCHAIN: 1.88.0으로 실제 검사 버전을 선택한다. Miri·sanitizer·fuzz
# 잡은 RUSTUP_TOOLCHAIN: nightly로 nightly 전용 도구와 플래그를 실행한다.
# 크레이트 MSRV 자체는 Cargo.toml의 rust-version = "1.88"이 단일 출처다.
[toolchain]
channel = "1.95.0"
profile = "minimal"
