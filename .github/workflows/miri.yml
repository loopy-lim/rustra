name: Miri

# miri 야간 검증 — FFI 크레이트의 unsafe(95+회)와 raw pointer 경로
# (from_raw_parts/copy_nonoverlapping)의 UB를 런타임 검증한다. 실스레드 스모크가
# 잡지 못하는 할당 경계 위반을 조기 발견.
#
# 제외 목록(MIRIFLAGS): FFI 진입점 테스트는 extern "C" 경계에서 호스트 포인터를
# 재구성하므로 miri 의 strict int-to-ptr 캐스팅 규칙과 충돌한다 — 이들은 대상이
# 아니라 경계 자체다. 레지스트리/코덱/이벤트 순수 로직이 검증 대상.
#
# A9 안전망 게이팅 — 주간/수동 실행과 Release 후보 검증에서 재사용한다.

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: '37 20 * * 0' # 일요일 KST 새벽 5:37 — 오프피크

jobs:
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAFETY_LOG_DIR: ${{ github.workspace }}/target/safety/miri
      MIRIFLAGS: -Zmiri-disable-isolation
    # continue-on-error 없음 — 주간 가시성 게이트. UB 발견은 즉시 triage
    # 대상이지 "실험 실패"로 흡수되지 않는다.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Record toolchain and candidate
        run: |
          mkdir -p "$SAFETY_LOG_DIR"
          { git rev-parse HEAD; rustc -Vv; cargo miri --version; } > "$SAFETY_LOG_DIR/environment.txt"
      - name: Run miri on lib tests
        run: bash scripts/run-safety-check.sh lib cargo miri test -p rustra --lib
      - name: Run miri on frame wire tests
        if: ${{ !cancelled() }}
        run: bash scripts/run-safety-check.sh frame-wire cargo miri test -p rustra --test frame_wire
      - name: Run miri on field order tests
        if: ${{ !cancelled() }}
        run: bash scripts/run-safety-check.sh field-order cargo miri test -p rustra --test field_order_drift
      - name: Upload Miri logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: miri-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/safety/miri/
          if-no-files-found: error
