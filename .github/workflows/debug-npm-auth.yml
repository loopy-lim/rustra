name: Debug npm auth

# NPM_TOKEN 이 어떤 계정으로 인증되는지, @rustra 스코프에 어떤 권한을
# 갖는지 확인하는 진단용 워크플로우. 토큰 값 자체는 출력하지 않는다.
on: workflow_dispatch

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Probe npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          echo "=== 1. npm whoami ==="
          npm whoami || true
          echo
          echo "=== 2. 실제 쓰기 테스트: dist-tag 추가/제거 (무해·가역) ==="
          npm dist-tag add @rustra/types@0.1.1 rustra-auth-probe 2>&1 || true
          echo
          echo "=== 3. dist-tag 확인 후 제거 ==="
          npm view @rustra/types dist-tags 2>&1 || true
          npm dist-tag rm @rustra/types rustra-auth-probe 2>&1 || true
          echo
          echo "=== 4. 실패 원인 상세 (npm ping + debug 로그) ==="
          npm dist-tag add @rustra/types@0.1.1 rustra-auth-probe --loglevel=silly 2>&1 | tail -25 || true
          npm dist-tag rm @rustra/types rustra-auth-probe 2>&1 > /dev/null || true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
