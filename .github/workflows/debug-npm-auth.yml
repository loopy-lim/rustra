name: Debug npm auth

# NPM_TOKEN 이 어떤 계정으로 인증되는지, @rustra 스코프에 어떤 권한을
# 갖는지 확인하는 진단용 워크플로우. 토큰 값 자체는 출력하지 않는다.
on: workflow_dispatch

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Probe npm auth
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          echo "=== npm whoami (계정 확인) ==="
          npm whoami || true
          echo
          echo "=== npm token list 전체 (토큰 타입/권한 확인) ==="
          npm token list 2>&1 || true
          echo
          echo "=== registry GET @rustra/types with token (200=커버됨, 404=토큰 커버 밖) ==="
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NPM_TOKEN" \
            "https://registry.npmjs.org/@rustra%2ftypes")
          echo "GET @rustra/types → HTTP $code"
          code2=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $NPM_TOKEN" \
            "https://registry.npmjs.org/@rustra%2freact-native")
          echo "GET @rustra/react-native → HTTP $code2"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
