name: Sanitizer

# A09 — AddressSanitizer/LeakSanitizer 야간 검증.
#
# 안정화 통합 문서(2026-09-05)의 A09 정의는 "sanitizer — native 환경, 수동
# 체크리스트로만"(실행 검증 보류)이었으나 A9 안전망 게이팅으로 격상됐다:
# miri(UB)·fuzz(디코드 신뢰 경계)와 함께 메모리 오염·누수(할당 경계, 버퍼
# 재구성, FFI 해제 경로)를 잡는 보완 트랙으로, 주간 스케줄 실패가 red 로
# 보인다. 주간/수동 실행과 Release 후보 검증에서 재사용한다. 실기기(RN) 검증은 여전히 수동
# 체크리스트 영역 — 안정화 통합 트랙 Task 15 가 작성할
# docs/verification-checklist.md 참조.
#
# lib와 명시한 FFI 통합 테스트의 debug/release를 검사한다. C++ callback
# containment는 별도 프로세스 harness다. RN 실기기 검증은 아니며 누수 검사는 유지한다.
#
# nightly 필수: `-Zsanitizer=address` 는 nightly 전용 플래그. 도구체인 결정은
# miri.yml 과 동일한 dtolnay/rust-toolchain@nightly 패턴을 따른다(별도
# rust-toolchain 파일 도입 없음).

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: '41 21 * * 0' # 일요일 KST 새벽 6:41 — 오프피크, miri(05:37)와 분산

jobs:
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 저장소의 stable 핀보다 우선해 nightly 전용 sanitizer를 실행한다.
      RUSTUP_TOOLCHAIN: nightly
      SAFETY_LOG_DIR: ${{ github.workspace }}/target/safety/asan
    # continue-on-error 없음 — 주간 가시성 게이트. 누수/오염 발견은 즉시
    # triage 대상이지 조용한 green 이 아니다.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Record toolchain and candidate
        run: |
          mkdir -p "$SAFETY_LOG_DIR"
          { git rev-parse HEAD; rustc -Vv; } > "$SAFETY_LOG_DIR/environment.txt"
      - name: Run lib tests under AddressSanitizer + LeakSanitizer
        env:
          # -Cunsafe-allow-abi-mismatch=sanitizer — 1.101 nightly(2026-11-01 로컬
          # 실측, 2026-10-31 nightly f9ceb4a4d)부터 사전컴파일 std(미계측)와
          # -Zsanitizer 조합이 경고가 아닌 하드 에러가 되어 기존 실행 모델이 깨진다.
          # 기존 의미론(app 코드만 계측, std 미계측 허용)을 유지하는 플래그.
          RUSTFLAGS: -Zsanitizer=address -Cunsafe-allow-abi-mismatch=sanitizer
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:log_path=${{ github.workspace }}/target/safety/asan/asan
          RUST_TEST_THREADS: '1'
        run: bash scripts/run-safety-check.sh lib cargo test -p rustra --lib --target x86_64-unknown-linux-gnu
      - name: Run FFI integration tests under AddressSanitizer + LeakSanitizer
        if: ${{ !cancelled() }}
        env:
          # -Cunsafe-allow-abi-mismatch=sanitizer — 1.101 nightly(2026-11-01 로컬
          # 실측, 2026-10-31 nightly f9ceb4a4d)부터 사전컴파일 std(미계측)와
          # -Zsanitizer 조합이 경고가 아닌 하드 에러가 되어 기존 실행 모델이 깨진다.
          # 기존 의미론(app 코드만 계측, std 미계측 허용)을 유지하는 플래그.
          RUSTFLAGS: -Zsanitizer=address -Cunsafe-allow-abi-mismatch=sanitizer
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:log_path=${{ github.workspace }}/target/safety/asan/ffi
          RUST_TEST_THREADS: '1'
        run: bash scripts/run-safety-check.sh ffi-debug cargo test -p rustra --target x86_64-unknown-linux-gnu --test trust_baseline_ffi --test payload_robustness --test ffi_process_contract --test large_payload_boundary --test ffi_scriptc
      - name: Run release FFI integration tests under AddressSanitizer + LeakSanitizer
        if: ${{ !cancelled() }}
        env:
          # -Cunsafe-allow-abi-mismatch=sanitizer — 1.101 nightly(2026-11-01 로컬
          # 실측, 2026-10-31 nightly f9ceb4a4d)부터 사전컴파일 std(미계측)와
          # -Zsanitizer 조합이 경고가 아닌 하드 에러가 되어 기존 실행 모델이 깨진다.
          # 기존 의미론(app 코드만 계측, std 미계측 허용)을 유지하는 플래그.
          RUSTFLAGS: -Zsanitizer=address -Cunsafe-allow-abi-mismatch=sanitizer
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:log_path=${{ github.workspace }}/target/safety/asan/ffi-release
          RUST_TEST_THREADS: '1'
        run: bash scripts/run-safety-check.sh ffi-release cargo test -p rustra --release --target x86_64-unknown-linux-gnu --test trust_baseline_ffi --test payload_robustness --test ffi_process_contract --test large_payload_boundary --test ffi_scriptc
      - name: Verify C++ foreign exception containment in child processes
        if: ${{ !cancelled() }}
        run: bash scripts/run-safety-check.sh foreign-exception bash scripts/run-foreign-exception-check.sh
      - name: Upload sanitizer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asan-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/safety/asan/
          if-no-files-found: error

  # C++ 어댑터 표면 — 생성 C++ 코덱·저수준 Writer/Reader·sync core 테스트를
  # ASan+LSan+UBSan 으로 검증한다. test-jsi-shim.hpp 덕에 Linux 에서 헤더 의존
  # 없이 빌드 가능하며, RustraJSIBridge.cpp 등 실제 JSI 바인딩은 여전히
  # 기기/Xcode 빌드(수동 체크리스트) 영역이다. UBSan 위반은
  # -fno-sanitize-recover 로 조용한 경고가 아닌 치명 실패가 된다.
  cpp-codec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAFETY_LOG_DIR: ${{ github.workspace }}/target/safety/cpp-codec
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: Record candidate
        run: |
          mkdir -p "$SAFETY_LOG_DIR"
          { git rev-parse HEAD; clang++ --version; } > "$SAFETY_LOG_DIR/environment.txt"
      - name: Run C++ codec tests under ASan + LSan + UBSan
        env:
          RUSTRA_CPP_SANITIZERS: address,undefined
        run: bash scripts/run-safety-check.sh cpp-codec bash examples/react-native-calculator/modules/rustra-jsi/ios/run-cpp-codec-tests.sh
      - name: Upload sanitizer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-codec-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/target/safety/cpp-codec/
          if-no-files-found: error
