name: Windows Experiment

# P1 FML PE 심볼 해석 실험 (배경 트랙 B1 — 2026-08-16 성장 트랙 설계).
# **Windows 는 Experimental 플랫폼이다** (README 플랫폼 지원 매트릭스 참조) —
# 런타임 검증(실제 앱 실행) 완료 전 production 지원 범위에서 제외된다.
# 실패해도 실험 데이터 수집이 목적 — lynx.dll export 덤프는 always 업로드.
# dumpbin /exports 결과로 kFml*ExportName(GetProcAddress 정식 경로) 또는
# kFml*Offset(PE 오프셋 fallback) 기입 여부를 확정한다.
# 상세: runner/template/desktop/WINDOWS.md, docs/plans/2026-08-12-lynx-windows-phase4.md

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runner/template/desktop/**'
      - '.github/workflows/windows-experiment.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true # 실험 잡 — 메인 CI 를 막지 않는다
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runner/template/backend
            runner/template/desktop/src-tauri

      - name: Install Lynx Windows SDK
        shell: pwsh
        run: |
          gh release download 4.0.1 --repo lynx-family/lynx --pattern lynx_sdk_windows_x64.zip --dir sdk
          Expand-Archive sdk/lynx_sdk_windows_x64.zip -DestinationPath sdk/lynx
          Get-ChildItem sdk/lynx -Recurse -Depth 2 | Select-Object -First 20 FullName
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dump lynx.dll exports (FML 심볼 해석의 근거 데이터)
        shell: pwsh
        run: |
          $dll = Get-ChildItem sdk/lynx -Recurse -Filter lynx.dll | Select-Object -First 1
          if (-not $dll) { Write-Host "lynx.dll not found in SDK"; exit 0 }
          Write-Host "lynx.dll: $($dll.FullName)"
          $dumpbin = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe | Select-Object -First 1
          & $dumpbin /exports $dll.FullName | Out-File -Encoding utf8 lynx-exports.txt
          Write-Host "--- FML/Lynx 관련 export (최대 40) ---"
          Select-String -Path lynx-exports.txt -Pattern "Fml|Lynx" | Select-Object -First 40 | ForEach-Object { $_.Line }

      - name: Build backend staticlib (MSVC)
        run: cargo build --release --manifest-path runner/template/backend/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build desktop host (lynx_desktop_win.cpp 링크 시도)
        run: cargo build --release --manifest-path runner/template/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
        env:
          LYNX_SDK: ${{ github.workspace }}\sdk\lynx

      - name: Upload artifacts (심볼 덤프)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-experiment-${{ github.run_id }}
          path: lynx-exports.txt
          if-no-files-found: ignore
