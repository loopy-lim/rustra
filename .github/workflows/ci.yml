name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 주간 취약점 스캔 — 커밋이 없는 기간에 공개된 신규 RUSTSEC 도 감지한다.
  # push/PR 트리거와 달리 이 스케줄은 rust-audit 잡만 실행된다(다른 잡은
  # github.event_name 조건으로 스킵).
  schedule:
    - cron: '23 4 * * 1'

jobs:
  # cargo audit — 취약점(vulnerabilities)이면 실패. unmaintained/unsound 경고는
  # 현재 gtk-rs/atk(tauri Linux 경유), atomic-polyfill(crossbeam 경유), bincode 등
  # transitive 한 경로뿐이라 warning 게이트는 걸지 않는다 (RUSTSEC 경고 목록은
  # docs/security-audit.md 참조).
  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      # audit-check 액션이 결과를 check-run 으로 게시한다 (없으면 임은 통과하지만
      # "Resource not accessible by integration" 경고가 남는다).
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # cargo-deny — 라이선스/밴/출처 검증. MIT 발행물의 법적 위생.
  # rustsec/audit-check 와 별개: 이 잡은 라이선스 호환성과 wildcard/알 수 없는
  # 출처를 게이트한다.
  rust-deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # fmt/clippy 는 코드가 OS 무관하게 동일하므로 ubuntu leg 에서만 실행해 CI 시간 절약.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      # --workspace 테스트는 rustra-tauri-calculator(gtk/webkit 필요, apt step 이 Linux 에서만
      # 설치)까지 빌드하므로 Linux 에서만 전체 워크스페이스를 돌린다. macOS/Windows 는 코어 크레이트만.
      - name: Test (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace
      # Release 프로파일 테스트 — debug 빌드에서만 나타나지 않는 최적화/릴리즈
      # 전용 경로(#[cfg(debug_assertions)] 등) 회귀를 잡는다 (감사 지적: CI가
      # production 게이트보다 약함).
      - name: Test release (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace --release
      - name: Test (macOS/Windows — core crates)
        if: runner.os != 'Linux'
        shell: bash
        run: cargo test -p rustra -p rustra-calculator-example
      - name: Build release cdylib
        shell: bash
        run: cargo build -p rustra-calculator-example --release
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustra-native-${{ matrix.os }}
          path: |
            target/release/librustra_calculator_example.so
            target/release/librustra_calculator_example.dylib
            target/release/rustra_calculator_example.dll
          if-no-files-found: ignore

  # MSRV(1.88) 계약 검증 — Cargo.toml rust-version 선언이 실제로 빌드되는지.
  # 1.95.0 상위 툴체인만 쓰면 MSRV를 깨는 의존성/코드가 머지돼도 CI가 green이다.
  # (1.87 에는 let-chains stabilized 가 없다 — rustra-macros 가 1.88 이상을 요구.)
  rust-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Check core crates build on MSRV
        run: cargo check -p rustra -p rustra-macros
      - name: Test core crate on MSRV
        run: cargo test -p rustra --lib

  # napi transport 경로(test:runtime:node-napi) — 어떤 CI 잡에서도 실행되지
  # 않아 무검증 방치였다. debug 애드온 빌드 + 런타임 스모크로 게이트한다.
  napi:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build calculator example
        run: cargo build -p rustra-calculator-example
      - name: Build napi addon (debug)
        run: npm run build:napi
      - name: Type check calculator
        run: npx tsc -p examples/calculator/tsconfig.json
      - name: napi runtime smoke
        run: npm run test:runtime:node-napi

  typescript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [rust, rust-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # test:compat 의 test:runtime:tauri 가 tauri-calculator release 빌드를
      # 돌린다 — gtk/webkit 시스템 의존이 필요하다 (rust 잡과 동일 목록).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: npm ci
      - name: Build @rustra/types first
        run: cd packages/types && npm run build
      - name: Build all packages
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Production dependency audit
        run: npm run audit:prod
      - name: Type check calculator
        run: npx tsc --noEmit -p examples/calculator/tsconfig.json
      - name: Type check crud
        run: npx tsc --noEmit -p examples/crud/tsconfig.json
      - name: Test TypeScript (Node)
        run: npm run test:ts:node
      - name: Install react-native example deps
        # test:adapters 체인의 test:app:react-native 이 예제 의존성(react,
        # react-native, nitro)을 필요로 한다 — 루트 npm ci 는 예제 node_modules 를
        # 설치하지 않는다.
        run: cd examples/react-native-calculator && npm install
      - name: Test adapters
        run: npm run test:adapters
      - name: Test CLI
        run: npm run test -w @rustra/cli
      - name: Full compatibility matrix (test:compat)
        # test:compat — ts:node/ts:bun/adapters/runtime 전체 체인. test:ts:bun 과
        # test:runtime:* 이 rustra-calculator-example 바이너리를 요구해 Rust
        # 툴체인이 필요하다 (rust 잡과 별도 캐시 재사용).
        run: npm run test:compat

  # RN 예제 네이티브 Release 빌드 — 감사에서 Android Release 실패가 P0 로
  # 지적됐다. Gradle 훅이 Rust 부터 빌드하므로 cargo-ndk + NDK 만 세팅하면
  # 클린 러너에서 assembleRelease 가 재현된다 (Phase 1 수정 검증).
  rn-android:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK 27.1.12297006
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
      - name: Export NDK_HOME for build-rust-android.sh
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Install example deps
        run: cd examples/react-native-calculator && npm install
      # App.tsx 가 @rustra/types 를 import 하고 metro.config.js 가 상위 루트의
      # node_modules 를 resolver 경로에 포함한다 (watchFolders: repoRoot) — 루트
      # 워크스페이스 의존성 설치와 @rustra/types 빌드가 선행돼야 JS 번들링이
      # 해석된다.
      - name: Install root deps and build @rustra/types
        run: |
          npm ci
          cd packages/types && npm run build
      # android/ 는 Expo prebuild 산물로 gitignore 되어 있다 (ios/ 도 동일).
      # 클린 체크아웃에서 재현하려면 prebuild 로 네이티브 프로젝트를 생성한다.
      # rustra-jsi 모듈은 react-native.config.js 로 autolink 되고 settings.gradle
      # include 가 예제 android 디렉터리에 대해 동작한다.
      - name: Expo prebuild (generate native android project)
        run: cd examples/react-native-calculator && npx expo prebuild --platform android --no-install
      - name: Build Release APK
        run: cd examples/react-native-calculator/android && ./gradlew assembleRelease -x lint
      - name: Verify APK contains rustrajsi native lib
        run: |
          unzip -l examples/react-native-calculator/android/app/build/outputs/apk/release/app-release.apk | grep -E "lib/(arm64-v8a|x86_64)/librustrajsi\.so"

  # RN iOS Release 프레임워크 빌드 — podspec prepare_command 이 Rust 를
  # 빌드한다. iOS 시뮬레이터 런타임 실행은 로컬 verify 게이트가 담당.
  rn-ios:
    runs-on: macos-latest
    needs: rust
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install example deps
        run: cd examples/react-native-calculator && npm install
      # App.tsx 가 @rustra/types 를 import 하고 metro.config.js 가 상위 루트의
      # node_modules 를 resolver 경로에 포함한다 — 루트 워크스페이스 의존성과
      # @rustra/types 빌드가 필요하다 (rn-android 와 동일).
      - name: Install root deps and build @rustra/types
        run: |
          npm ci
          cd packages/types && npm run build
      # ios/ 도 android/ 와 마찬가지로 Expo prebuild 산물 (gitignore). prebuild 는
      # 기존 네이티브 파일의 수동 패치(settings.gradle include, podspec 연결)를
      # 유지한다 — 로컬 검증으로 byte-identical 보존 확인.
      - name: Expo prebuild (generate native ios project)
        run: cd examples/react-native-calculator && npx expo prebuild --platform ios --no-install
      - name: Build iOS Release (simulator, no codesign)
        # pipefail — tail 파이프가 xcodebuild 실패 exit code 를 삼키지 않게.
        run: |
          set -o pipefail
          cd examples/react-native-calculator/ios
          pod install --project-directory=.
          xcodebuild -workspace reactnativecalculator.xcworkspace -scheme reactnativecalculator -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5

  # 소비자 설치 smoke — 실제 npm tarball을 빈 디렉터리에 설치해 배포물이
  # 스스로 동작하는지 검증 (감사: '소비자 설치 후 smoke test' 없음).
  consumer-smoke:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Install packed packages as a consumer
        run: |
          mkdir -p /tmp/rustra-pack
          for pkg in types node bun tauri react-native react testing devtools cli; do
            npm pack --workspace @rustra/$pkg --pack-destination /tmp/rustra-pack
          done
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm pkg set type=module
          npm install --no-save /tmp/rustra-pack/rustra-*.tgz
      - name: Smoke — installed packages load (ESM)
        run: |
          cd /tmp/consumer
          node --input-type=module -e "
            import * as types from '@rustra/types';
            import * as node from '@rustra/node';
            import * as bun from '@rustra/bun';
            import * as tauri from '@rustra/tauri';
            import * as rn from '@rustra/react-native';
            import * as react from '@rustra/react';
            import * as testing from '@rustra/testing';
            import * as devtools from '@rustra/devtools';
            console.log('consumer install ok:',
              Object.keys(types).length, Object.keys(node).length,
              Object.keys(bun).length, Object.keys(tauri).length,
              Object.keys(rn).length, Object.keys(react).length,
              Object.keys(testing).length, Object.keys(devtools).length, 'exports');
          "
      - name: Smoke — CLI bin runs from tarball
        run: |
          cd /tmp/consumer
          npx rustra --help | head -3
