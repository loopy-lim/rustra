name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # --workspace 는 default-members 를 무시하고 macOS 전용 크레이트까지 빌드한다.
        # lynx-tauri-spike 은 자체 verify.sh 게이트(macOS 전제)로 검증.
        run: cargo test --workspace --exclude rustra-lynx-tauri-spike

  typescript:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build @rustra/types first
        run: cd packages/types && npm run build
      - name: Build all packages
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check calculator
        run: npx tsc --noEmit -p examples/calculator/tsconfig.json
      - name: Type check crud
        run: npx tsc --noEmit -p examples/crud/tsconfig.json
      - name: Test TypeScript (Node)
        run: npm run test:ts:node
      - name: Test adapters
        run: npm run test:adapters
      - name: Test CLI
        run: npm run test -w @rustra/cli
