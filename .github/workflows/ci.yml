name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 주간 취약점 스캔 — 커밋이 없는 기간에 공개된 신규 RUSTSEC 도 감지한다.
  # push/PR 트리거와 달리 이 스케줄은 rust-audit 잡만 실행된다(다른 잡은
  # github.event_name 조건으로 스킵). 스킵 전제가 중요하다: release.yml 의
  # workflow_run 게이트는 CI workflow 의 "success" 로 판정하므로, schedule
  # 실행(잡이 전부 skip 이어도 conclusion=success)이 발행을 발동해선 안 된다 —
  # release 쪽 가드(event != 'schedule')와 한 쌍이다.
  schedule:
    - cron: '23 4 * * 1'

jobs:
  # cargo audit — 알려진 Tauri 2/GTK3 업스트림 예외 외에는 informational 경고까지
  # 전부 실패시킨다. 예외 목록과 근거는 docs/security-audit.md 에서 관리한다.
  rust-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: bash scripts/audit-rust.sh

  # cargo-deny — 라이선스/밴/출처 검증. MIT 발행물의 법적 위생.
  # rust-audit 잡과 별개: 이 잡은 라이선스 호환성과 wildcard/알 수 없는 출처를
  # 게이트한다.
  rust-deny:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # fmt/clippy 는 코드가 OS 무관하게 동일하므로 ubuntu leg 에서만 실행해 CI 시간 절약.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      # --workspace 테스트는 rustra-tauri-calculator(gtk/webkit 필요, apt step 이 Linux 에서만
      # 설치)까지 빌드하므로 Linux 에서만 전체 워크스페이스를 돌린다. macOS/Windows 는 코어 크레이트만.
      - name: Test (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace
      # Release 프로파일 테스트 — debug 빌드에서만 나타나지 않는 최적화/릴리즈
      # 전용 경로(#[cfg(debug_assertions)] 등) 회귀를 잡는다 (감사 지적: CI가
      # production 게이트보다 약함).
      - name: Test release (Linux — full workspace)
        if: runner.os == 'Linux'
        run: cargo test --workspace --release
      - name: Test (macOS/Windows — core crates)
        if: runner.os != 'Linux'
        shell: bash
        run: cargo test -p rustra -p rustra-calculator-example
      - name: Build release cdylib
        shell: bash
        run: cargo build -p rustra-calculator-example --release
      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: rustra-native-${{ matrix.os }}
          path: |
            target/release/librustra_calculator_example.so
            target/release/librustra_calculator_example.dylib
            target/release/rustra_calculator_example.dll
          if-no-files-found: ignore

  # MSRV(1.88) 계약 검증 — Cargo.toml rust-version 선언이 실제로 빌드되는지.
  # 1.95.0 상위 툴체인만 쓰면 MSRV를 깨는 의존성/코드가 머지돼도 CI가 green이다.
  # (1.87 에는 let-chains stabilized 가 없다 — rustra-macros 가 1.88 이상을 요구.)
  rust-msrv:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Check core crates build on MSRV
        run: cargo check -p rustra -p rustra-macros
      - name: Test core crate on MSRV
        run: cargo test -p rustra --lib

  # wasm32-unknown-unknown 컴파일 check — wasm dev target(dev.target: "wasm",
  # wasm.engine: "wasm3") 을 위한 선수 게이트. 컴파일만 단언하고 테스트 실행은
  # 아키텍처 제약으로 범위 밖이다. hard gate 유지 — 실패 시 이 diff 이전 기준선인지
  # 신규 파손인지 귀속해 확인해야 한다(red baseline 에서 시작하지 않는다는 교훈:
  # 게이트 파손은 내 diff 여부와 무관하게 먼저 확인).
  rust-wasm32:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check core crate compiles for wasm32
        run: cargo check -p rustra --target wasm32-unknown-unknown

  # napi transport 경로(test:runtime:node-napi) — 어떤 CI 잡에서도 실행되지
  # 않아 무검증 방치였다. debug 애드온 빌드 + 런타임 스모크로 게이트한다.
  napi:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # rust-cache 를 쓰지 않는다 — 캐시 복원된 target/ 에서 cargo 가 "Finished
      # (up to date)" 로 링크 산출 복사를 스킵하면 .node 가 누락된다(캐시는
      # .node 최종 산출을 저장하지 않는다). 잡이 1분대라 캐시 이득이 작다.
      - name: Install napi example deps
        run: bun install --cwd examples/calculator-napi --frozen-lockfile
      - name: Build napi addon (debug)
        run: bun run build:napi
      # 산출 확인 — linux 산출명은 ABI 접미사 포함(linux-x64-gnu). 앱이 두 형태를
      # 순서대로 시도하므로 여기선 대략 존재만 단언.
      - name: Verify addon artifact
        run: ls examples/calculator-napi/*.node
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      # calculator tsconfig은 생성된 Node/Tauri entrypoint까지 함께 검사한다.
      # package exports가 dist 타입을 가리키므로 types만 빌드하면 깨끗한 CI에서
      # @rustra/node와 @rustra/tauri 선언을 찾을 수 없다.
      - name: Build workspace packages
        run: bun run build
      - name: Build calculator example binary
        run: cargo build -p rustra-calculator-example
      - name: Type check calculator
        run: bunx tsc -p examples/calculator/tsconfig.json
      - name: napi runtime smoke
        run: node dist-ts/examples/calculator/apps/node-napi-app.js

  typescript:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: [rust, rust-audit]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      # test:compat 의 test:runtime:tauri 가 tauri-calculator release 빌드를
      # 돌린다 — gtk/webkit 시스템 의존이 필요하다 (rust 잡과 동일 목록).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build @rustra/types first
        run: bun run --cwd packages/types build
      - name: Build all packages
        run: bun run build
      - name: Release version coherence
        run: bun run test:release-coherence
      - name: Lint
        run: bun run lint
      - name: React Doctor (100/100, warnings block)
        shell: bash
        run: set -o pipefail && bunx --bun react-doctor@0.9.12 . --yes --scope full --verbose --blocking warning 2>&1 | tee "$RUNNER_TEMP/rustra-react-doctor.log"
      - name: Format check
        run: bun run format:check
      - name: Production dependency audit
        run: bun run audit:prod
      - name: Type check calculator
        shell: bash
        run: set -o pipefail && bunx tsc --noEmit -p examples/calculator/tsconfig.json 2>&1 | tee "$RUNNER_TEMP/rustra-tsc-calculator.log"
      - name: Type check crud
        shell: bash
        run: set -o pipefail && bunx tsc --noEmit -p examples/crud/tsconfig.json 2>&1 | tee "$RUNNER_TEMP/rustra-tsc-crud.log"
      - name: Test TypeScript (Bun 1.4)
        run: bun run test:ts:bun
      - name: Install react-native example deps
        # test:adapters 체인의 test:app:react-native 이 예제 의존성(react,
        # react-native, nitro)을 필요로 하므로 루트 workspace와 별도로 앱
        # node_modules를 설치한다.
        run: bun install --cwd examples/react-native-calculator --frozen-lockfile
      - name: Verify bare React Native zero-config fixture
        run: |
          bun install --cwd examples/react-native-bare-calculator --frozen-lockfile
          bun run --cwd examples/react-native-bare-calculator codegen
          bun run --cwd examples/react-native-bare-calculator typecheck
          bun run --cwd examples/react-native-bare-calculator test:autolink
      - name: Install Tauri example deps
        run: bun install --cwd examples/tauri-calculator --frozen-lockfile
      - name: Test adapters
        run: bun run test:adapters
      - name: Test CLI
        run: bun run --cwd packages/cli test
      - name: Test complex codec receipt
        run: bun run test:complex-codec-bench
      - name: Bench regression gate unit tests
        # check-criterion-regression.mjs 로직의 단위 테스트 — umbrella `test`
        # 스크립트에만 포함돼 CI가 놓치고 있었다.
        run: bun run test:bench-gate
      - name: Full compatibility matrix (test:compat)
        # test:compat — ts:node/ts:bun/adapters/runtime 전체 체인. test:ts:bun 과
        # test:runtime:* 이 rustra-calculator-example 바이너리를 요구해 Rust
        # 툴체인이 필요하다 (rust 잡과 별도 캐시 재사용).
        run: bun run test:compat
      - name: Build calculator example dylib
        # packages/bun 의 into-binding 테스트가 release dylib 를 로드한다 —
        # register! id 는 등록 순서이므로 dylib 가 stale 이면 테스트도 stale
        # 결과를 낸다. 항상 클린 재빌드 후 실행.
        run: cargo build -p rustra-calculator-example --release
      - name: Test packages (bun binding + react-native engine)
        # packages/bun 이 FFI caller-buffer(sentinel/overflow 재시도/재사용
        # 버퍼 비앨리어싱) 계약의 유일한 자동화 검증이다. umbrella `test`에만
        # 있어 CI가 놓치던 것을 PR 게이트로 승격.
        run: bun run --cwd packages/bun test
      - name: Test types + react-native engine units
        # packages/types(세대 게이트 등 엔진 코어 계약)와
        # packages/react-native(레거시 JSI 스킵/재동기화)는 umbrella `test`에만
        # 있어 PR 게이트가 놓치고 있었다. examples glob과 별도로 직접 실행한다.
        run: |
          bun run --cwd packages/types test
          bun run --cwd packages/react-native test
      - name: C++ generated codec tests
        # TS/Rust/C++ 3면 PINNED hex 게이트의 C++ 다리 — shim 테스트가 실제로
        # 실행돼야 생성 코덱과 fixture 간 드리프트를 PR 단계에서 잡는다.
        run: bash examples/react-native-calculator/modules/rustra-jsi/ios/run-cpp-codec-tests.sh
      - name: Onboarding gate (init → doctor → codegen → demo)
        # 신규 사용자 여정을 임시 디렉토리에서 실동행 검증 — 산문이 아니라
        # 게이트로 계약한다. init 스캐폴드가 repo CLI의 dist를 소비하므로
        # bun run build 이후 실행되어야 한다.
        run: bun run test:onboarding
      - name: Docs sync gate (docs:sync 마커 ↔ 생성물)
        # 문서에 붙여 넣은 생성 코드 샘플이 현실과 갈라지는 반복 패턴을
        # 게이트로 종결한다. 마커 영역을 참조 파일과 byte-for-byte 대조한다.
        run: bun run test:docs

      # 실패 로그 보존 — tsc/react-doctor 는 콘솔 전용이라 잡 로그 retention 이
      # 지나면 사라진다(tee 로 파일로 남긴다). bun 설치 실패는 bun-debug.log 를
      # 남기므로 함께 보존한다.
      - name: Upload failure logs (TypeScript)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-typescript
          path: |
            ${{ runner.temp }}/rustra-tsc-calculator.log
            ${{ runner.temp }}/rustra-tsc-crud.log
            ${{ runner.temp }}/rustra-react-doctor.log
            bun-debug.log
            examples/**/bun-debug.log
            packages/**/bun-debug.log
          if-no-files-found: ignore
          retention-days: 14

  # RN 예제 네이티브 Release 빌드 — 감사에서 Android Release 실패가 P0 로
  # 지적됐다. Gradle 훅이 Rust 부터 빌드하므로 cargo-ndk + NDK 만 세팅하면
  # 클린 러너에서 assembleRelease 가 재현된다 (Phase 1 수정 검증).
  rn-android:
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install NDK 27.1.12297006
        run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
      - name: Export NDK_HOME for build-rust-android.sh
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      # 생성된 RN entrypoint는 @rustra/react-native package export를 import하고,
      # 그 export는 dist/index.js를 가리킨다. file: 의존성을 설치하기 전에 루트
      # workspace를 빌드해야 앱 node_modules 스냅샷에도 dist가 포함된다.
      - name: Install root deps and build workspace packages
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install example deps
        run: bun install --cwd examples/react-native-calculator --frozen-lockfile
      - name: Regenerate the autolinked Rustra module
        run: bun run --cwd examples/react-native-calculator codegen
      - name: Verify packed React Native consumer resolves native sources
        run: bun run verify:consumer:react-native
      # android/ 는 Expo prebuild 산물로 gitignore 되어 있다 (ios/ 도 동일).
      # 클린 체크아웃에서 재현하려면 prebuild 로 네이티브 프로젝트를 생성한다.
      # 생성된 @rustra/generated-react-native 모듈은 react-native.config.js 만으로
      # autolink 된다. 클린 네이티브 프로젝트에 수동 Gradle 패치는 없다.
      - name: Expo prebuild (generate native android project)
        working-directory: examples/react-native-calculator
        # prebuild 실패도 디버깅 가능해야 하므로 로그를 파일로 남긴다. pipefail
        # 필수 — tee 가 마지막 명령이라 pipefail 없이는 prebuild 실패가 흡수된다.
        shell: bash
        run: set -o pipefail && bunx expo prebuild --platform android --no-install 2>&1 | tee "$RUNNER_TEMP/rustra-expo-prebuild-android.log"
      - name: Build Release APK
        env:
          NODE_ENV: production
        shell: bash
        run: set -o pipefail && cd examples/react-native-calculator/android && ./gradlew assembleRelease -x lint --stacktrace 2>&1 | tee "$RUNNER_TEMP/rustra-gradle.log"
      - name: Verify APK contains the uniquely named Rustra native lib
        run: |
          unzip -l examples/react-native-calculator/android/app/build/outputs/apk/release/app-release.apk | grep -E "lib/(arm64-v8a|x86_64)/librustra_bridge\.so"

      # 실패 로그 보존 — gradle/prebuild 로그는 잡 로그 retention 이 지나면 사라진다.
      # autolinking 실패는 주로 prebuild/codegen 단계에서, 네이티브 링크 실패는
      # gradle 단계에서 진단된다. 성공 시 업로드하지 않는다(if: failure()).
      - name: Upload failure logs (Android)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-rn-android
          path: |
            ${{ runner.temp }}/rustra-gradle.log
            ${{ runner.temp }}/rustra-expo-prebuild-android.log
          if-no-files-found: ignore
          retention-days: 14

  # RN iOS Release 프레임워크 빌드 — podspec prepare_command 이 Rust 를
  # 빌드한다. iOS 시뮬레이터 런타임 실행은 로컬 verify 게이트가 담당.
  rn-ios:
    runs-on: macos-latest
    needs: rust
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # Android와 동일하게 생성 entrypoint가 참조하는 workspace package dist를
      # 먼저 만들어 file: 의존성 설치 결과를 소비자 tarball과 맞춘다.
      - name: Install root deps and build workspace packages
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install example deps
        run: bun install --cwd examples/react-native-calculator --frozen-lockfile
      - name: Regenerate the autolinked Rustra module
        run: bun run --cwd examples/react-native-calculator codegen
      - name: Verify packed React Native consumer resolves native sources
        run: bun run verify:consumer:react-native
      # ios/ 도 android/ 와 마찬가지로 Expo prebuild 산물 (gitignore). 생성 모듈의
      # podspec은 CocoaPods autolinking만 사용하며 Podfile 수동 패치는 필요 없다.
      - name: Expo prebuild (generate native ios project)
        working-directory: examples/react-native-calculator
        # Android 와 동일 — prebuild 실패 로그를 보존한다(실패 시 pod/xcodebuild
        # 로그는 아예 생성되지 않는다).
        shell: bash
        run: set -o pipefail && bunx expo prebuild --platform ios --no-install 2>&1 | tee "$RUNNER_TEMP/rustra-expo-prebuild-ios.log"
      - name: Build iOS Release (simulator, no codesign)
        shell: bash
        run: |
          set -o pipefail
          cd examples/react-native-calculator/ios
          # pod install 은 치명적으로 유지한다(원래 실패 의미 보존) — tee 로 로그만
          # 남긴다. podspec prepare_command 의 Rust 빌드 출력도 여기에 담긴다.
          pod install --project-directory=. 2>&1 | tee "$RUNNER_TEMP/rustra-pod.log"
          if ! xcodebuild -workspace reactnativecalculator.xcworkspace -scheme reactnativecalculator -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/rustra-xcodebuild.log" 2>&1; then
            tail -n 200 "$RUNNER_TEMP/rustra-xcodebuild.log"
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/rustra-xcodebuild.log"
      # 실패 로그 보존 — xcodebuild 로그는 기본 보존(90일) 후 사라지므로 artifact로
      # 남긴다. pod install 실패는 xcodebuild 로그가 아예 생성되지 않는 고장이므로
      # pod 로그도 함께 보존한다. 성공 시 일반 로그만으로 충분하다(if: failure()).
      - name: Upload failure logs (iOS)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs-rn-ios
          path: |
            ${{ runner.temp }}/rustra-xcodebuild.log
            ${{ runner.temp }}/rustra-pod.log
            ${{ runner.temp }}/rustra-expo-prebuild-ios.log
          if-no-files-found: ignore
          retention-days: 14

  # 소비자 설치 smoke — 실제 npm tarball을 빈 디렉터리에 설치해 배포물이
  # 스스로 동작하는지 검증 (감사: '소비자 설치 후 smoke test' 없음).
  consumer-smoke:
    runs-on: ubuntu-latest
    needs: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build all packages
        run: bun run build
      - name: Verify React Native files are present in packed artifacts
        run: bun run verify:package:react-native
      - name: Verify packed React Native consumer resolves native sources
        run: bun run verify:consumer:react-native
      - name: Install packed packages as a consumer
        run: |
          mkdir -p /tmp/rustra-pack
          for pkg in types node bun tauri react-native react testing devtools cli; do
            (cd "packages/$pkg" && bun pm pack --destination /tmp/rustra-pack)
          done
          mkdir -p /tmp/consumer && cd /tmp/consumer
          bun init -y > /dev/null
          bun pm pkg set type=module
          for rustra_types_tgz in /tmp/rustra-pack/rustra-types-*.tgz; do
            bun pm pkg set "overrides.@rustra/types=file:$rustra_types_tgz"
            break
          done
          bun add --no-save /tmp/rustra-pack/rustra-*.tgz
      - name: Smoke — installed packages load (ESM)
        run: |
          cd /tmp/consumer
          bun --eval "
            import * as types from '@rustra/types';
            import * as node from '@rustra/node';
            import * as bun from '@rustra/bun';
            import * as tauri from '@rustra/tauri';
            import * as rn from '@rustra/react-native';
            import * as react from '@rustra/react';
            import * as testing from '@rustra/testing';
            import * as devtools from '@rustra/devtools';
            console.log('consumer install ok:',
              Object.keys(types).length, Object.keys(node).length,
              Object.keys(bun).length, Object.keys(tauri).length,
              Object.keys(rn).length, Object.keys(react).length,
              Object.keys(testing).length, Object.keys(devtools).length, 'exports');
          "
      - name: Smoke — CLI bin runs from tarball
        run: |
          cd /tmp/consumer
          bunx --bun rustra --help | head -3
      - name: Smoke — CLI init generates and runs a clean project
        run: |
          cd /tmp/consumer
          bunx --bun rustra init /tmp/rustra-init
          cd /tmp/rustra-init
          for rustra_types_tgz in /tmp/rustra-pack/rustra-types-*.tgz; do
            bun pm pkg set "overrides.@rustra/types=file:$rustra_types_tgz"
            break
          done
          for rustra_cli_tgz in /tmp/rustra-pack/rustra-cli-*.tgz; do
            bun pm pkg set "overrides.@rustra/cli=file:$rustra_cli_tgz"
            break
          done
          for rustra_node_tgz in /tmp/rustra-pack/rustra-node-*.tgz; do
            bun pm pkg set "overrides.@rustra/node=file:$rustra_node_tgz"
            break
          done
          bun install
          # 발행 전 release candidate를 현재 checkout의 Rust crate로 고정한다.
          # crates.io의 이전 버전으로 조용히 폴백하면 소비자 검증이 거짓 green이 된다.
          sed -i "s#rustra = \"[^\"]*\"#rustra = { path = \"$GITHUB_WORKSPACE/crates/rustra\" }#" Cargo.toml
          sed -i "s#rustra-macros = \"[^\"]*\"#rustra-macros = { path = \"$GITHUB_WORKSPACE/crates/rustra-macros\" }#" Cargo.toml
          bun run codegen
          test -f generated/schema.json
          test -f src/generated/rkyv-codecs.ts
          cargo run | grep "hello from rustra"

  # 필수 잡 집계 gate — branch protection 이 이 단일 체크만 요구하면 된다.
  # needs.*.result 의 공식 값은 success/failure/cancelled/skipped 4종이며(Actions
  # contexts 레퍼런스), contains(needs.*.result, ...) 배열 필터도 표현식으로
  # 가능하다. 그럼에도 env-var fan-out 을 쓰는 이유: (1) 판정 로직을 유닛테스트된
  # 셸 스크립트(scripts/ci-gate.test.ts)로 추출해야 한다 — if: 표현식은 로컬
  # 단위 테스트가 불가능하다. (2) rust 는 매트릭스 job 이라 per-leg outputs 노출
  # 자체가 불가능하다. 잡은 10개 result 를 그대로 전달만 한다.
  #
  # if: always() 필수 — 선행 잡이 실패하면 기본 조건에서는 gate 자체가 skip 되어
  # "gate green = 전체 green" 계약이 깨진다. always() 로 항상 실행해 판정한다.
  #
  # skipped 를 실패로 치는 이유: consumer-smoke 는 typescript 실패 시 skip 되는
  # 체인이므로, skip 통과는 체인 실패의 조용한 green 이 된다.
  #
  # schedule 실행은 gate 도 skip 한다(rust-audit 잡의 스케줄 전제와 한 쌍). 잡
  # 대부분이 skip 되는 스케줄 실행에서 gate 가 red 가 되면 주간 red 노이즈와
  # "전부 skip 인데 conclusion=success" 문서 전제가 함께 깨진다. 발행은
  # release.yml 의 event != 'schedule' 가드로 별도 차단된다.
  gate:
    needs:
      [
        rust,
        rust-msrv,
        rust-wasm32,
        rust-audit,
        rust-deny,
        napi,
        typescript,
        rn-android,
        rn-ios,
        consumer-smoke,
      ]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # bash 한 번 실행이 전부 — 토큰 권한 불필요, hung runner 가 branch-protection
    # 체크를 기본 360분 동안 pending 시키지 않게 짧은 타임아웃을 건다.
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Aggregate mandatory results
        env:
          GATE_RUST: ${{ needs.rust.result }}
          GATE_RUST_MSRV: ${{ needs.rust-msrv.result }}
          GATE_RUST_WASM32: ${{ needs.rust-wasm32.result }}
          GATE_RUST_AUDIT: ${{ needs.rust-audit.result }}
          GATE_RUST_DENY: ${{ needs.rust-deny.result }}
          GATE_NAPI: ${{ needs.napi.result }}
          GATE_TYPESCRIPT: ${{ needs.typescript.result }}
          GATE_RN_ANDROID: ${{ needs.rn-android.result }}
          GATE_RN_IOS: ${{ needs.rn-ios.result }}
          GATE_CONSUMER_SMOKE: ${{ needs.consumer-smoke.result }}
        # 주의: run 에 | 리터럴 블록을 쓴다. 폴딩 스칼라(기본)는 줄바꿈을 공백으로
        # 접어 `\<space>` 가 이스케이프 공백이 돼 인자가 " rust=..." 로 합쳐지고
        # ci-gate.sh 가 unknown job 으로 죽는다(2026-09-06 실측, 라운드 4).
        run: |
          bash scripts/ci-gate.sh \
            "rust=$GATE_RUST" \
            "rust-msrv=$GATE_RUST_MSRV" \
            "rust-wasm32=$GATE_RUST_WASM32" \
            "rust-audit=$GATE_RUST_AUDIT" \
            "rust-deny=$GATE_RUST_DENY" \
            "napi=$GATE_NAPI" \
            "typescript=$GATE_TYPESCRIPT" \
            "rn-android=$GATE_RN_ANDROID" \
            "rn-ios=$GATE_RN_IOS" \
            "consumer-smoke=$GATE_CONSUMER_SMOKE"
