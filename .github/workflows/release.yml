name: Release

on:
  # Release는 main push와 독립적으로 즉시 실행하지 않는다. CI 전체 workflow가
  # 성공한 동일 commit에서만 실행해, build/test/lint/audit 결과를 선행 게이트로 삼는다.
  # workflow_dispatch 는 허용하지 않는다 — 수동 실행이 CI 게이트를 우회할 수
  # 있어서 (감사 지적). 재시도가 필요하면 CI 를 재실행하면 release 가 재표 triggered 된다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI가 green인 경우에만 발행을 시도한다 (CI 실패 시 release 스킵).
  # workflow_dispatch 우회를 제거해 이 조건은 workflow_run success 로만 만족한다.
  release:
    name: Changesets Publish (npm)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets가 버전 커밋/PR을 만들 수 있도록 전체 히스토리 필요
          fetch-depth: 0
          # workflow_run에서는 CI가 실제로 검증한 commit을 checkout한다.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm run audit:prod

      # ci.yml 과 동일 — npm run build -ws 는 의존성 순서를 보장하지 않으므로
      # @rustra/types 를 먼저 빌드한다 (다른 패키지가 dist 타입을 import 함).
      - name: Build @rustra/types first
        run: cd packages/types && npm run build

      - name: Build packages
        run: npm run build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npx changeset version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node 의 registry-url 이 만드는 _temp/.npmrc 를 NPM_CONFIG_USERCONFIG
          # 로 가리키는데, 그 파일은 ${NODE_AUTH_TOKEN} 환경변수를 참조한다.
          # changesets 가 $HOME/.npmrc 에 쓰는 NPM_TOKEN 은 USERCONFIG 우선순위에
          # 밀려 무시된다 — NODE_AUTH_TOKEN 을 명시하지 않으면 publish 가
          # 무인증 PUT 이 되고, npm 은 스코프 패키지 권한없음을 E404 로 위장해
          # 돌려준다. changesets/action 정식 조합대로 NODE_AUTH_TOKEN 을 잡는다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production

  # crates.io 발행은 수동 트리거 전용 (rustra-macros → rustra 순서 필수).
  cargo-publish:
    name: Publish crates (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish rustra-macros first (path dependency)
        run: cargo publish -p rustra-macros --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index propagation
        run: sleep 30
      - name: Publish rustra
        run: cargo publish -p rustra --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
