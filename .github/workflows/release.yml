name: Release

on:
  # Release는 main push와 독립적으로 즉시 실행하지 않는다. CI 전체 workflow가
  # 성공한 동일 commit에서만 실행해, build/test/lint/audit 결과를 선행 게이트로 삼는다.
  # npm 발행은 workflow_run 전용이다. crates.io는 삭제/덮어쓰기가 불가능하므로
  # main의 동일 SHA에서 CI 성공을 재확인하는 별도 수동 잡으로만 발행한다.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # CI가 green인 경우에만 발행을 시도한다 (CI 실패 시 release 스킵).
  # workflow_dispatch 우회를 제거해 이 조건은 workflow_run success 로만 만족한다.
  release:
    name: Changesets Publish (npm)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets가 버전 커밋/PR을 만들 수 있도록 전체 히스토리 필요
          fetch-depth: 0
          # workflow_run에서는 CI가 실제로 검증한 commit을 checkout한다.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production dependency audit
        run: bun run audit:prod

      # ci.yml 과 동일 — workspace 병렬 빌드 전
      # @rustra/types 를 먼저 빌드한다 (다른 패키지가 dist 타입을 import 함).
      - name: Build @rustra/types first
        run: bun run --cwd packages/types build

      - name: Build packages
        run: bun run build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node 의 registry-url 이 만드는 _temp/.npmrc 를 NPM_CONFIG_USERCONFIG
          # 로 가리키는데, 그 파일은 ${NODE_AUTH_TOKEN} 환경변수를 참조한다.
          # changesets 가 $HOME/.npmrc 에 쓰는 NPM_TOKEN 은 USERCONFIG 우선순위에
          # 밀려 무시된다 — NODE_AUTH_TOKEN 을 명시하지 않으면 publish 가
          # 무인증 PUT 이 되고, npm 은 스코프 패키지 권한없음을 E404 로 위장해
          # 돌려준다. changesets/action 정식 조합대로 NODE_AUTH_TOKEN 을 잡는다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_ENV: production
          # npm provenance — id-token: write 권한(위 선언)으로 Sigstore 출처 증명을
          # tarball에 첨부한다. 발견된 패키지의 공급망 신뢰성 직결.
          NPM_CONFIG_PROVENANCE: true

  # crates.io 발행은 main 수동 트리거 전용 (rustra-macros → rustra 순서 필수).
  # 실행 직전 동일 SHA의 CI 성공을 확인하므로 workflow_dispatch가 게이트를 우회하지 않는다.
  cargo-publish:
    name: Publish crates (manual)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require green CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --commit "$GITHUB_SHA" --workflow CI --limit 1 --json conclusion --jq '.[0].conclusion')"
          test "$conclusion" = "success"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate publishable crates
        run: |
          cargo fmt --all -- --check
          cargo clippy -p rustra -p rustra-macros --all-targets -- -D warnings
          cargo test -p rustra -p rustra-macros --release
          cargo publish -p rustra-macros --dry-run --locked
      - name: Publish rustra-macros first (path dependency)
        run: cargo publish -p rustra-macros --locked
      - name: Wait for crates.io index propagation
        run: |
          # 워크스페이스 버전을 동적으로 읽는다 — 하드코딩하면 버전 범프마다 이
          # 루프가 옛 버전을 확인해 즉시 탈출(대기 no-op)하고 dry-run이 깨진다.
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rustra-macros") | .version')"
          echo "waiting for rustra-macros@${VERSION} on crates.io index"
          for attempt in {1..12}; do
            cargo info "rustra-macros@${VERSION}" >/dev/null 2>&1 && exit 0
            sleep 10
          done
          exit 1
      - name: Verify rustra package
        run: cargo publish -p rustra --dry-run --locked
      - name: Publish rustra
        run: cargo publish -p rustra --locked
