name: Coverage

# advisory — 게이트가 아니라 가시화. 수치가 안정되면(2-3주) PR 리포트/임계 도입을
# 검토한다. Rust 는 cargo-llvm-cov, TS 는 c8(Bun build 산출 dist 에서 측정,
# 소스맵으로 src/ 에 리맵 — 별도 --all/include 패턴 불필요).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - name: Rust coverage (rustra + macros)
        # pipefail 필수 — 없으면 파이프 마지막 명령(tail)의 exit 0 가 잡 성공으로
        # 이어져 llvm-cov/테스트 실패가 조용히 묻힌다.
        run: |
          set -o pipefail
          cargo llvm-cov -p rustra -p rustra-macros --summary-only 2>&1 | tee cov.txt | tail -15 >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov -p rustra -p rustra-macros --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: lcov.info

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: TS coverage (c8)
        # pipefail 필수 — 없으면 bun 테스트 실패가 tail 의 exit 0 에 묻혀 coverage
        # 수치가 전부 실패한 테스트 기준으로 나온다(false signal). 또한 이 잡은
        # cargo 빌드가 없어 target/ 가 비어 있으므로 네이티브 dlopen 테스트
        # (packages/bun, examples 런타임)는 여기서 어차피 실패한다 — coverage:ts
        # 가 유닛 성격의 테스트만 집는지 확인한다(실패 시 이 잡이 적신다).
        run: |
          set -o pipefail
          bun run coverage:ts 2>&1 | tee cov-ts.txt | tail -20 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ts-lcov
          path: coverage/lcov.info
