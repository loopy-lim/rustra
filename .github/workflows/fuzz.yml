name: Fuzz

# Frame 디코드 경로(신뢰 경계) 무작위 입력 검증 — 10분 타임박스 (배경 트랙 B2).
# cargo-fuzz 는 nightly + 별도 crate (fuzz/, 메인 workspace 비멤버) 로 격리.
# 크래시 아티팩트는 업로드 후 이슈로 수동 등록한다.
#
# A9 안전망 게이팅 — 주간/수동 실행과 Release 후보 검증에서 재사용한다.

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 6' # 토요일 KST 새벽 4:23 — 오프피크

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [invoke_frame, invoke_complex_value, invoke_complex_serde]
    # continue-on-error 없음 — 주간 가시성 게이트. 실패 run 을 red 로 남겨
    # 크래시/빌드 고장을 반드시 triage 한다(크래시 발견 자체는 수확이다 —
    # 아티팩트를 이슈로 승격).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      # 시드 corpus(git 추적, 대표 100개)를 먼저 재생 — 주간 실행이 매번 0시드로
      # 시작하던 것을 개선한다. 발견한 새 커버리지는 아티팩트로 남는다.
      - name: Replay seed corpus
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp -R seeds/. corpus/${{ matrix.target }}/
          cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -runs=0
      - name: Fuzz ${{ matrix.target }} (10min)
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} corpus/${{ matrix.target }} -- -max_total_time=600 -max_len=1024
      - name: Upload evolved corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: error
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
