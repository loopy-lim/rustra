name: Benchmark

# 벤치마크 회귀 감지 (masterplan 4-2). 수동 트리거 + main 머지 후 선택 실행.
# criterion 결과를 GitHub Steps summary 로 남긴다. 성능 회귀 임계 초과 시
# (criterion 기본 임계) job 을 실패시켜 가시화한다.

on:
  workflow_dispatch:
    inputs:
      bootstrap_baseline:
        description: 'Create the first platform baseline without comparing a previous run'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'crates/rustra/**'
      - 'packages/types/**'
      - 'packages/cli/**'
      - 'examples/react-native-calculator/modules/**'
      - 'examples/calculator/**'
      - '.github/workflows/bench.yml'
      - 'scripts/check-criterion-regression*'
      - 'scripts/benchmark-workflow.test.mjs'
      - 'scripts/benchmark-environment*'

jobs:
  rust-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # main 커밋에 벤치 리포트 댓글을 게시하기 위해 write 필요
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Reset cached Criterion artifacts
        run: rm -rf target/criterion
      # 직전 성공 벤치의 criterion baseline 복원 — 없으면 change: 이 첫 측정
      # 기준(no baseline)이 되어 회귀 감지가 무의미해진다. retention(14일)
      # 내 아티팩트만 유효하다.
      - name: Restore previous baseline
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: bench.yml
          branch: main
          name: criterion-results
          path: target/criterion

      - name: Record benchmark environment
        run: bun scripts/benchmark-environment.mjs target/criterion

      - name: Require a real previous baseline
        if: github.event_name != 'workflow_dispatch' || inputs.bootstrap_baseline != true
        run: |
          if ! find target/criterion -path '*/base/estimates.json' -print -quit | grep -q .; then
            echo 'No previous Criterion baseline was restored.' >&2
            echo 'Run workflow_dispatch once with bootstrap_baseline=true, then rerun normally.' >&2
            exit 1
          fi

      - name: Discard restored measurements before this run
        run: bun scripts/check-criterion-regression.mjs --prepare

      # dev 프로파일 벤치 — dynamic(Tier 3) 경로가 register 로만 도달해
      # debug 빌드가 필요하다 ( benches/tier_compare.rs 주석 참조 ).
      # bash -o pipefail: `| tee` 만으로는 cargo bench 의 비정상 종료(패닉 등)가
      # tee 종료 코드(0)에 묻혀 거짓 그린이 된다(실증: dynamic_registry 패닉
      # 무시, 2026-09-01).
      - name: Run tier_compare benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p rustra --profile dev --bench tier_compare 2>&1 | tee bench_tier.txt

      - name: Run type_scaling benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p rustra --profile dev --bench type_scaling 2>&1 | tee bench_scaling.txt

      - name: Run dynamic_registry benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p rustra --profile dev --bench dynamic_registry 2>&1 | tee bench_dynamic.txt

      - name: Run complex_route benchmark
        shell: bash
        run: |
          set -o pipefail
          # complex_route is fully static, so measure the production-equivalent
          # optimized path instead of the dev-only dynamic command profile.
          cargo bench -p rustra --bench complex_route 2>&1 | tee bench_complex.txt

      - name: Run tree_route benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p rustra --bench tree_route 2>&1 | tee bench_tree.txt

      - name: Run function_dispatch benchmark
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p rustra --bench function_dispatch 2>&1 | tee bench_functions.txt

      - name: Enforce 10% regression budget
        id: gate
        if: github.event_name != 'workflow_dispatch' || inputs.bootstrap_baseline != true
        run: |
          bun scripts/check-criterion-regression.mjs --max-regression 0.10 --report bench-report.md

      - name: Summary
        if: always()
        run: |
          {
            echo "## Benchmark results"
            echo '```'
            grep -E "time:|change:|Performance has" bench_tier.txt bench_scaling.txt bench_dynamic.txt bench_complex.txt bench_tree.txt bench_functions.txt || true
            echo '```'
            if [ -f bench-report.md ]; then
              cat bench-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish report to commit
        # main 벤치 결과를 커밋 댓글로 게시 — GitHub UI 에서 회귀/재부트 판정을
        # 바로 볼 수 있게 한다. 게이트 실패(진짜 회귀)에도 판정 내용을 남긴다.
        if: always() && github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('bench-report.md')) {
              core.info('No bench-report.md (bootstrap run) — skip comment.');
              return;
            }
            const body = [
              '## 📊 Benchmark report',
              '',
              fs.readFileSync('bench-report.md', 'utf8'),
              '',
              `Run: ${process.env.GH_RUN_URL}`,
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body,
            });
        env:
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload criterion artifacts
        # 게이트를 통과한 결과만 새 baseline이 된다. 회귀가 포함된 결과를
        # 업로드하면 다음 실행이 오염된 base와 비교해 회귀가 고착된다
        # (첫 실패 +10% → 다음 실패 또 +10% 누적 우회). 실패 결과는 별도
        # 아티팩트명으로 보존해 원인 분석은 가능하게 한다.
        # 비교 불가(exit 3)와 벤치 자체 실패도 미채택. 명시적 bootstrap 성공만 예외다.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-results${{ (failure() || cancelled()) && '-rejected' || '' }}
          path: target/criterion/
          retention-days: 14
