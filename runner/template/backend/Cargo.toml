[package]
name = "rustra-template-backend"
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false
# ▶ create-runner.sh 가 <app>-backend 로 치환.

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

# 독립 워크스페이크 루트 — 템플릿이 rustra-bridge 워크스페이스에 종속되지 않게.
# 복사 후에도 자족하며, path 의존성(create-runner.sh 이 published/path 로 재작성)으로 빌드된다.
[workspace]

[dependencies]
# 템플릿 검증용 path 의존성. 프로젝트 외부로 복사 시 published crate("0.1") 또는
# 로컬 path 로 변경 — create-runner.sh 가 안내.
# ▶ 버전은 rustra(examples/calculator) 가 검증한 핀과 동일하게. 특히 schemars 는 rustra 가
#   re-export 하는 JsonSchema trait 의 메이저 버전(0.8)과 정확히 맞아야 한다 — 불일치 시 derive 충돌.
rustra = { path = "../../../crates/rustra" }
schemars = { version = "0.8", features = ["derive", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1", features = ["alloc"] }
rkyv = { version = "0.8", features = ["bytecheck", "alloc"] }

[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
